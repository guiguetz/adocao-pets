name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  hygiene:
    name: PR Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
          scopes: |
            auth
            orgs
            pets
            discovery
            queue
            scheduling
            ci
            deps
            docs

      - name: Check branch name
        if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|test|ci|perf)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "❌ Branch name '$BRANCH' does not match pattern: <type>/<number>-<slug>"
            exit 1
          fi

      - name: Check PR size
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.additions + pr.deletions > 400) {
              core.warning('PR is too large (>400 lines). Consider breaking it into smaller PRs.');
            }

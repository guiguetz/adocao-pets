# Plan Feature Workflow
# Creates a detailed implementation plan for a feature
name: plan-feature
description: Cria plano de implementação detalhado
provider: pi

nodes:
  # 1. Understand the feature
  - id: understand
    prompt: |
      Analise a feature solicitada.

      Entrada: $ARGUMENTS

      Leia:
      1. docs/product-spec.md - requisitos do produto
      2. specs/product/ - escopo e visão
      3. AGENTS.md - regras do projeto

      Extraia:
      - O que a feature faz
      - Por que é necessária
      - Requisitos funcionais
      - Requisitos não-funcionais

      Output: Entendimento da feature

  # 2. Explore codebase
  - id: explore
    depends_on: [understand]
    prompt: |
      Explore o codebase para entender onde implementar.

      Busque:
      1. Arquivos relacionados à feature
      2. Padrões existentes similares
      3. Dependências e integrações
      4. Testes existentes relevantes

      Use as ferramentas:
      - graft_find_code para buscar conceitos
      - graft_trace_calls para entender fluxos
      - graft_repo_map para visão geral

      Output: Mapa do codebase relevante

  # 3. Design solution
  - id: design
    depends_on: [explore]
    prompt: |
      Proponha a solução técnica.

      Considere:
      1. Arquitetura - onde encaixar?
      2. Padrões - seguir existentes ou criar novo?
      3. Testes - estratégia de cobertura
      4. Migrações - banco de dados necessário?

      Decisões:
      - Quais arquivos criar?
      - Quais arquivos modificar?
      - Quais testes escrever?

      Output: Proposta de solução

  # 4. Break into tasks
  - id: tasks
    depends_on: [design]
    prompt: |
      Quebre a implementação em tarefas pequenas.

      Cada tarefa deve:
      - Ser independente (pode ser feita separadamente)
      - Ter critérios de aceite claros
      - Ter comando de verificação
      - Estimar complexidade (S/M/L)

      Formato:
      - [ ] Tarefa 1: descrição (complexidade)
      - [ ] Tarefa 2: descrição (complexidade)

      Output: Lista de tarefas

  # 5. Create story spec
  - id: spec
    depends_on: [tasks]
    prompt: |
      Crie a especificação da story para bigpowers.

      Formato: specs/epics/eXX-slug/STORY.md

      Inclua:
      1. Título
      2. Descrição
      3. Critérios de aceite
      4. Tarefas (do output anterior)
      5. Comando de verificação
      6. Dependências
      7. Tags (story: eXXsXX)

      Output: Especificação da story em markdown

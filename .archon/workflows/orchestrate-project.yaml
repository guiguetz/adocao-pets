# Orchestrate Project Workflow
# Full development lifecycle using bigpowers methodology
name: orchestrate-project
description: Ciclo completo de desenvolvimento com bigpowers
provider: pi

nodes:
  # 1. Discover - Understand requirements
  - id: discover
    prompt: |
      Execute a fase de descoberta do bigpowers.
      
      Leia:
      1. docs/product-spec.md - requisitos do produto
      2. specs/product/ - escopo e visão existente
      3. AGENTS.md e CONVENTIONS.md - regras do projeto
      
      Tarefas:
      1. Analise o documento do produto
      2. Identifique épicos e stories
      3. Crie specs/product/SCOPE_LATEST.md
      4. Crie specs/product/VISION_LATEST.md
      
      Output: Documentos de escopo e visão

  # 2. Plan - Create release plan
  - id: plan
    depends_on: [discover]
    prompt: |
      Crie o plano de release.
      
      Baseado na descoberta anterior:
      1. Identifique épicos prioritários
      2. Ordene por WSJF (Weighted Shortest Job First)
      3. Crie specs/release-plan.yaml
      4. Defina milestones (fase-0 a fase-4)
      
      Formato do release-plan.yaml:
      ```yaml
      epics:
        - id: e001
          title: Setup do repositório
          priority: 1
          stories:
            - id: e001s01
              title: Estrutura base
              status: pending
          ```
      
      Output: release-plan.yaml

  # 3. Slice - Break into stories
  - id: slice
    depends_on: [plan]
    prompt: |
      Crie as stories detalhadas.
      
      Para cada épico:
      1. Leia o plano de release
      2. Crie diretório specs/epics/eXXX-slug/
      3. Para cada story, crie STORY.md com:
         - Título e descrição
         - Critérios de aceite (checklist)
         - Tarefas [BCP N]
         - Comando verify:
         - Dependências
         - Tags
      
      Output: Stories criadas em specs/epics/

  # 4. Execute - Build stories with TDD
  - id: execute
    depends_on: [slice]
    loop:
      prompt: |
        Execute o ciclo de build do bigpowers.
        
        Leia specs/execution-status.yaml para saber qual story construir.
        
        Para a story atual:
        1. Crie branch (kickoff-branch)
        2. Implemente com TDD (ciclo RED-GREEN-REFACTOR)
        3. Rode verificação (pnpm verify)
        4. Crie PR (release-branch)
        
        Atualize execution-status.yaml após cada story.
        
        Pare quando todas as stories estiverem completas.
        
        Output: "DONE" quando terminar
      until: "DONE"
      max_iterations: 50
      fresh_context: true

  # 5. Verify - Final validation
  - id: verify
    depends_on: [execute]
    prompt: |
      Valide o projeto completo.
      
      Verificações:
      1. Todos os testes passam?
      2. Typecheck ok?
      3. Lint ok?
      4. Build funciona?
      5. Documentação atualizada?
      6. Todos os PRs merged?
      
      Se houver problemas:
      - Corrija se forem simples
      - Reporte se forem complexos
      
      Output: Relatório de validação

  # 6. Release - Prepare for deployment
  - id: release
    depends_on: [verify]
    prompt: |
      Prepare o projeto para release.
      
      Tarefas:
      1. Atualize CHANGELOG.md
      2. Verifique versão no package.json
      3. Crie tag git se necessário
      4. Documente quaisquer pendências
      
      Output: Projeto pronto para deploy